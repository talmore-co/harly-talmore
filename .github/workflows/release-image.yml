name: Release container image

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Target server architecture
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    # This workflow publishes only the Talmore fork's images.
    if: github.repository == 'talmore-co/harly-talmore'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/talmore-co/harly-talmore
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.title=Harly
            org.opencontainers.image.description=Self-hosted applicant tracking system
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan published image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/talmore-co/harly-talmore@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Block fixed CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/talmore-co/harly-talmore@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Write Coolify image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo '## Coolify deployment image'
            echo
            echo "Image: \`ghcr.io/talmore-co/harly-talmore@${IMAGE_DIGEST}\`"
            echo "Version: \`sha-${SOURCE_SHA}\`"
            echo
            echo 'Use this same image for the app, migrate, and scheduler services.'
            echo 'Commands: serve, migrate, and scheduler, respectively.'
          } >> "$GITHUB_STEP_SUMMARY"
